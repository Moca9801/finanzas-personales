<div class="flex h-screen bg-gray-100 font-sans">

    <!-- Mobile sidebar backdrop -->
    <div *ngIf="isSidebarOpen"
        class="fixed inset-0 z-20 bg-black bg-opacity-40 lg:hidden backdrop-blur-sm transition-opacity"
        (click)="toggleSidebar()">
    </div>

    <!-- Sidebar -->
    <aside [class.translate-x-0]="isSidebarOpen" [class.-translate-x-full]="!isSidebarOpen"
        class="fixed inset-y-0 left-0 z-30 w-72 transform bg-white border-r border-gray-100 transition-all duration-300 lg:static lg:translate-x-0">
        <div class="flex h-full flex-col">
            <!-- Logo area -->
            <div class="flex items-center px-8 py-10 mb-2">
                <div
                    class="h-10 w-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-100 mr-3">
                    <span class="text-white text-lg font-bold">ef</span>
                </div>
                <span class="text-2xl font-bold text-gray-900 tracking-tight">easy<span
                        class="text-indigo-600">finansy</span></span>
            </div>

            <!-- Navigation -->
            <nav class="flex-1 overflow-y-auto px-4 space-y-1">
                <a routerLink="/" routerLinkActive="bg-indigo-50 text-indigo-600 shadow-sm"
                    [routerLinkActiveOptions]="{exact: true}"
                    class="flex items-center px-4 py-3 text-gray-500 hover:bg-gray-50 hover:text-indigo-600 rounded-xl transition-all group">
                    <span class="font-semibold">Dashboard</span>
                </a>
                <a routerLink="/accounts" routerLinkActive="bg-indigo-50 text-indigo-600 shadow-sm"
                    class="flex items-center px-4 py-3 text-gray-500 hover:bg-gray-50 hover:text-indigo-600 rounded-xl transition-all group">
                    <span
                        class="font-semibold text-sm uppercase tracking-wider opacity-60 group-hover:opacity-100 mr-2">01</span>
                    <span class="font-semibold">Cuentas</span>
                </a>
                <a routerLink="/transactions" routerLinkActive="bg-indigo-50 text-indigo-600 shadow-sm"
                    class="flex items-center px-4 py-3 text-gray-500 hover:bg-gray-50 hover:text-indigo-600 rounded-xl transition-all group">
                    <span
                        class="font-semibold text-sm uppercase tracking-wider opacity-60 group-hover:opacity-100 mr-2">02</span>
                    <span class="font-semibold">Transacciones</span>
                </a>
                <a routerLink="/budgets" routerLinkActive="bg-indigo-50 text-indigo-600 shadow-sm"
                    class="flex items-center px-4 py-3 text-gray-500 hover:bg-gray-50 hover:text-indigo-600 rounded-xl transition-all group">
                    <span
                        class="font-semibold text-sm uppercase tracking-wider opacity-60 group-hover:opacity-100 mr-2">03</span>
                    <span class="font-semibold">Presupuestos</span>
                </a>
                <a routerLink="/debts" routerLinkActive="bg-indigo-50 text-indigo-600 shadow-sm"
                    class="flex items-center px-4 py-3 text-gray-500 hover:bg-gray-50 hover:text-indigo-600 rounded-xl transition-all group">
                    <span
                        class="font-semibold text-sm uppercase tracking-wider opacity-60 group-hover:opacity-100 mr-2">04</span>
                    <span class="font-semibold">Deudas</span>
                </a>
            </nav>

            <!-- Logout area -->
            <div class="p-6 border-t border-gray-50 mt-auto">
                <button (click)="logout()"
                    class="flex items-center w-full px-4 py-3 text-gray-400 hover:bg-rose-50 hover:text-rose-600 rounded-xl transition-all font-bold group">
                    <span class="flex-1 text-left">Cerrar Sesión</span>
                    <svg class="w-5 h-5 opacity-50 group-hover:opacity-100" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                </button>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex flex-1 flex-col overflow-hidden">
        <!-- Header (Mobile toggle & Branding) -->
        <header class="flex items-center justify-between lg:hidden p-4 bg-white border-b border-gray-100">
            <button (click)="toggleSidebar()"
                class="p-2 text-gray-500 focus:outline-none hover:bg-gray-50 rounded-lg transition-colors">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
            <h1 class="text-xl font-bold text-gray-900 tracking-tight">easy<span class="text-indigo-600">finansy</span>
            </h1>
            <div class="w-10"></div> <!-- Balance spacer -->
        </header>

        <!-- Dynamic Content -->
        <main class="flex-1 overflow-auto bg-gray-50/50">
            <div class="max-w-7xl mx-auto p-6 md:p-8 lg:p-12">
                <router-outlet></router-outlet>
            </div>
        </main>
    </div>
</div>
